name: evesh_wealth
description: eVesh Family Wealth Management — Indian investors PWA
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.5.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # HTTP
  dio: ^5.4.3

  # Local storage / offline
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # Charts
  fl_chart: ^0.68.0
  syncfusion_flutter_charts: ^26.2.14
  syncfusion_flutter_pdf: ^26.2.14

  # Forms & UI
  flutter_typeahead: ^5.2.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  lottie: ^3.1.0

  # File handling
  file_picker: ^8.0.3
  open_filex: ^4.5.0

  # Utils
  intl: ^0.19.0
  crypto: ^3.0.3
  uuid: ^4.4.0
  connectivity_plus: ^6.0.3
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  logger: ^2.4.0

  # Code generation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Firebase (FCM push notifications)
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.2
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/fonts/

  # Fonts will be added later (Google Fonts loaded at runtime)
